<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opal CV Studio | Design Your Future</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-serif { font-family: 'Lora', serif; }
    .font-mono { font-family: 'JetBrains+Mono', monospace; }

    /* Native Print Handling: The most robust way to generate PDF from browser */
    @media print {
      /* Hide everything by default */
      body * {
        visibility: hidden;
        margin: 0;
      }
      /* Only show the specific resume container and its children */
      .print-container, .print-container * {
        visibility: visible;
      }
      .print-container {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        transform: scale(1) !important;
      }
      /* Standard A4/Letter size handling */
      @page {
        size: A4;
        margin: 0mm;
      }
      /* Ensure colors and backgrounds print */
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }

    /* Scrollbar utilities */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .pattern-grid {
      background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
      background-size: 20px 20px;
    }
  </style>
